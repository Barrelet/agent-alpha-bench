[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alphabench"
version = "0.1.0"
description = "agent-alpha-bench — an evaluation harness for LLMs as medium-term equity investors"
requires-python = ">=3.10"
dependencies = ["pandas>=2.2", "numpy>=1.26", "pyarrow>=15", "yfinance>=0.2.50", "pydantic>=2.6", "requests>=2.31", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
include = ["alphabench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
